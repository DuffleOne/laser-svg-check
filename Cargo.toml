[package]
name = "laser-check"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false }
kurbo = "0.13.1"
notify = "8.2.2"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
svgtypes = "0.16.2"
tiny-skia = "0.12.0"
toml = "1.2.1"

[profile.release]
lto = "thin"
strip = true
