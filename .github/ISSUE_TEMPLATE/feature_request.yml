name: Idea or request
description: Something Laser Check could do better or should do as well.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Start with the problem rather than the solution. What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: software
    attributes:
      label: Design and laser software you use
      placeholder: "Illustrator, Inkscape, LightBurn, xTool Creative Space…"
